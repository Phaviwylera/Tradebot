name: live-connectivity-check
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gamma markets
        run: |
          curl -sS --max-time 20 -o /tmp/gamma.json -w "gamma %{http_code} %{size_download}\n" \
            "https://gamma-api.polymarket.com/markets?active=true&closed=false&limit=2&order=volume24hr&ascending=false"
          python3 - <<'PY'
          import json
          rows = json.load(open('/tmp/gamma.json'))
          print('markets:', len(rows))
          if rows:
              m = rows[0]
              print('first:', m.get('question'), '| tokens:', m.get('clobTokenIds'), '| prices:', m.get('outcomePrices'))
              open('/tmp/token.txt','w').write(json.loads(m.get('clobTokenIds') or '[]')[0])
          PY
      - name: CLOB history
        run: |
          TOKEN=$(cat /tmp/token.txt)
          curl -sS --max-time 20 -o /tmp/clob.json -w "clob %{http_code} %{size_download}\n" \
            "https://clob.polymarket.com/prices-history?market=$TOKEN&interval=1d&fidelity=15"
          head -c 200 /tmp/clob.json; echo
      - name: Google News RSS
        run: |
          curl -sS --max-time 20 -o /tmp/news.xml -w "news %{http_code} %{size_download}\n" \
            "https://news.google.com/rss/search?q=bitcoin+price&hl=en-US&gl=US&ceid=US:en"
          head -c 200 /tmp/news.xml; echo
